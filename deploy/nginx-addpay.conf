# nginx config สำหรับ addpay.co.th
# วางไฟล์นี้ที่ /etc/nginx/sites-available/addpay.co.th บน server
# แล้วเปิดใช้: sudo ln -s /etc/nginx/sites-available/addpay.co.th /etc/nginx/sites-enabled/
#            sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name addpay.co.th www.addpay.co.th;

    # === โฟลเดอร์ที่วางไฟล์หน้าเว็บ (zoovdio.html) ===
    # อัป zoovdio.html ไปไว้ที่นี่ แล้วเปิด https://addpay.co.th/zoovdio.html
    root /var/www/api-node/public;
    index index.html;

    # ขนาดไฟล์อัปโหลดสูงสุด — ต้อง >= limit ใน multer (500MB) ไม่งั้นโดน 413 ก่อนถึง Node
    client_max_body_size 500M;

    # === /api/... → ส่งต่อไป Node (port 3000) แล้วตัด /api ทิ้ง ===
    # เช่น /api/zoovdio  → Node เห็นเป็น /zoovdio
    #      /api/uploads/videos/x.mp4 → Node เห็นเป็น /uploads/videos/x.mp4
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;   # เครื่องหมาย / ท้าย url = ตัด /api ออก
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # เผื่อ WebSocket (socket.io ในโปรเจกต์) ทำงานผ่าน proxy ได้ด้วย
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # อัป/สตรีมไฟล์วิดีโอใหญ่ ไม่ให้ timeout เร็ว
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # === ไฟล์หน้าเว็บอื่น ๆ เสิร์ฟตรงจากดิสก์ ===
    location / {
        try_files $uri $uri/ =404;
    }
}
